name = "darkroom"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The client app (server/public/index.html) is served as static assets.
# Requests to /api/* run the Worker; everything else serves the app.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database. `npm run setup` (or `npx wrangler d1 create darkroom`) fills in
# database_id for you — replace the placeholder below with the id it prints.
[[d1_databases]]
binding = "DB"
database_name = "darkroom"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"
