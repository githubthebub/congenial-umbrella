<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LINKMON — link-cable Pokémon battles, free in your browser</title>
  <meta name="description" content="A free, no-download, no-account Pokémon battler you play with a friend by sharing a link. Peer-to-peer, mobile-first, and better than Showdown where it counts: getting into a delightful battle in seconds." />
  <meta name="theme-color" content="#070a14" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph / share preview: the invite should look like a gift, not a link -->
  <meta property="og:title" content="I challenge you to a battle ⚡" />
  <meta property="og:description" content="Open this and we're dueling — no download, no account. LINKMON: link-cable Pokémon battles in your browser." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- LINKMON boots here. Static, self-contained, zero backend. -->
    <div class="screen" style="padding:40px 16px;text-align:center">
      <div class="spinner" style="margin:60px auto"></div>
      <p class="muted">Loading the Arena…</p>
      <noscript><p style="margin-top:20px">LINKMON needs JavaScript enabled to run.</p></noscript>
    </div>
  </div>
  <div id="toasts"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
